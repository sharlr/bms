# Production stack for an Ubuntu VPS.
#   cp .env.example .env && ./scripts/gen-secrets.sh >> .env   (then edit)
#   docker compose up -d --build
name: bms

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  traefik:
    <<: *hardening
    image: traefik:v3.3
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
    ports: ["80:80", "443:443"]
    environment:
      BMS_DOMAIN: ${BMS_DOMAIN:?set BMS_DOMAIN}
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    networks: [edge]
    depends_on: [web, api]

  web:
    <<: *hardening
    build: ./frontend
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    networks: [edge]

  api:
    <<: *hardening
    build: ./backend
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${BMS_DOMAIN}
      PG_HOST: postgres
      PG_USER: ${BMS_DB_USER:-bms_app}
      PG_PASSWORD: ${BMS_DB_PASSWORD:?set BMS_DB_PASSWORD}
      PG_MASTER_DB: ${BMS_MASTER_DB:-bms_master}
      SECRETS_KEY: ${BMS_SECRETS_KEY:?set BMS_SECRETS_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - backups:/backups      # tenant backups (copy off-site, see docs/DEPLOYMENT.md)
    cap_drop: [ALL]
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 768m } }

  postgres:
    <<: *hardening
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      BMS_DB_USER: ${BMS_DB_USER:-bms_app}
      BMS_DB_PASSWORD: ${BMS_DB_PASSWORD}
      BMS_MASTER_DB: ${BMS_MASTER_DB:-bms_master}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m
    networks: [internal]   # never published to the host or the internet

networks:
  edge: {}
  internal:
    internal: true          # database network has no route to the internet

volumes:
  pgdata: {}
  backups: {}
  letsencrypt: {}
